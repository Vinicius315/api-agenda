services:
  db:
    image: postgres:16-alpine
    container_name: api_agenda_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_agenda
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_agenda"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
